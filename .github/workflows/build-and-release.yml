name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            suffix: linux-amd64
            ext: ''
            goflags: 'CGO_ENABLED=1 GOOS=linux GOARCH=amd64'
            ldflags: '-s -w -linkmode external -extldflags "-static"'
            tags: ''
            cross_compiler: ''
            needs_frontend: true
          - runner: ubuntu-latest
            os: linux
            arch: arm64
            suffix: linux-arm64
            ext: ''
            goflags: 'CGO_ENABLED=1 GOOS=linux GOARCH=arm64'
            ldflags: '-s -w -linkmode external -extldflags "-static"'
            tags: ''
            cross_compiler: 'aarch64-linux-gnu'
            needs_frontend: false
          - runner: ubuntu-latest
            os: linux
            arch: armv7
            suffix: linux-armv7
            ext: ''
            goflags: 'CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7'
            ldflags: '-s -w -linkmode external -extldflags "-static"'
            tags: ''
            cross_compiler: 'arm-linux-gnueabihf'
            needs_frontend: false
          - runner: windows-latest
            os: windows
            arch: amd64
            suffix: windows-amd64
            ext: '.exe'
            goflags: 'CGO_ENABLED=1 GOOS=windows GOARCH=amd64'
            ldflags: '-s -w -linkmode external -extldflags "-static"'
            tags: 'timetzdata'
            cross_compiler: ''
            needs_frontend: false
          - runner: macos-latest
            os: darwin
            arch: amd64
            suffix: macos-amd64
            ext: ''
            goflags: 'CGO_ENABLED=1 GOOS=darwin GOARCH=amd64'
            ldflags: '-s -w'
            tags: ''
            cross_compiler: ''
            needs_frontend: false
          - runner: macos-latest
            os: darwin
            arch: arm64
            suffix: macos-arm64
            ext: ''
            goflags: 'CGO_ENABLED=1 GOOS=darwin GOARCH=arm64'
            ldflags: '-s -w'
            tags: ''
            cross_compiler: ''
            needs_frontend: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install cross-compiler for Linux arm
      if: matrix.target.cross_compiler != ''
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.target.cross_compiler }}

    - name: Install MinGW for Windows
      if: matrix.target.os == 'windows'
      shell: pwsh
      run: |
        $mingwVersion = "15.2.0"
        $mingwRevision = "v13-rev1"
        $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/${mingwVersion}-rt_${mingwRevision}/x86_64-${mingwVersion}-release-posix-seh-ucrt-rt_${mingwRevision}.7z"
        $archive = "C:\mingw.7z"
        $mingwDir = "C:\mingw64"

        Write-Host "Downloading MinGW from ${url}"
        Invoke-WebRequest -Uri ${url} -OutFile ${archive}

        Remove-Item -Recurse -Force ${mingwDir} -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path ${mingwDir}

        Write-Host "Extracting MinGW to ${mingwDir}"
        7z x ${archive} -oC:\
        "${mingwDir}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Fix go modules
      run: |
        go clean -modcache
        go mod tidy

    - name: Set up Node.js (for frontend build)
      if: matrix.target.needs_frontend
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build frontend
      if: matrix.target.needs_frontend
      run: |
        npm install
        npm run build

    - name: Build for Linux/macOS ${{ matrix.target.arch }}
      if: matrix.target.os != 'windows'
      run: |
        VERSION=$(grep '"version": ' package.json | awk -F ':' '{print $2}' | tr -d ' ' | tr -d ',' | tr -d '"')
        COMMIT_HASH=$(git rev-parse --short=7 HEAD)
        BUILD_UNIXTIME=$(date '+%s')

        ${{ matrix.target.goflags }} go build -a -v -trimpath \
          -ldflags="${{ matrix.target.ldflags }} -X main.Version=$VERSION -X main.CommitHash=$COMMIT_HASH -X main.BuildUnixTime=$BUILD_UNIXTIME" \
          ${{ matrix.target.tags != '' && format('-tags="{0}"', matrix.target.tags) || '' }} \
          -o ezbookkeeping${{ matrix.target.ext }} ezbookkeeping.go

        ls -la ezbookkeeping*

    - name: Build for Windows ${{ matrix.target.arch }}
      if: matrix.target.os == 'windows'
      shell: pwsh
      run: |
        $version = (Get-Content package.json | ConvertFrom-Json).version
        $commitHash = git rev-parse --short=7 HEAD
        $buildUnixTime = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()

        $env:CGO_ENABLED = "1"
        $env:GOOS = "windows"
        $env:GOARCH = "amd64"

        $extraArgs = "-X main.Version=$version -X main.CommitHash=$commitHash -X main.BuildUnixTime=$buildUnixTime"

        go build -a -v -trimpath -tags timetzdata -ldflags "-s -w -linkmode external -extldflags '-static' $extraArgs" -o ezbookkeeping.exe ezbookkeeping.go

        Remove-Item Env:\CGO_ENABLED -ErrorAction SilentlyContinue
        Remove-Item Env:\GOOS -ErrorAction SilentlyContinue
        Remove-Item Env:\GOARCH -ErrorAction SilentlyContinue

        Get-ChildItem ezbookkeeping*

    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-${{ matrix.target.suffix }}
        path: ezbookkeeping${{ matrix.target.ext }}

    - name: Upload frontend artifact
      if: matrix.target.needs_frontend
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Set up build parameters
        id: params
        run: |
          VERSION=$(grep '"version": ' package.json | awk -F ':' '{print $2}' | tr -d ' ' | tr -d ',' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: |
          PACKAGE_ROOT=package
          rm -rf $PACKAGE_ROOT
          mkdir -p $PACKAGE_ROOT

          for target in linux-amd64 linux-arm64 linux-armv7 windows-amd64 macos-amd64 macos-arm64; do
            PKG_DIR=$PACKAGE_ROOT/ezbookkeeping-$target
            mkdir -p $PKG_DIR
            mkdir -p $PKG_DIR/data
            mkdir -p $PKG_DIR/storage
            mkdir -p $PKG_DIR/log

            if [ "$target" = "windows-amd64" ]; then
              cp artifacts/backend-$target/ezbookkeeping.exe $PKG_DIR/
            else
              cp artifacts/backend-$target/ezbookkeeping $PKG_DIR/
              chmod +x $PKG_DIR/ezbookkeeping
            fi

            cp -R artifacts/frontend-dist/dist $PKG_DIR/public
            cp -R conf $PKG_DIR/conf
            cp -R templates $PKG_DIR/templates
            cp LICENSE $PKG_DIR/
          done

          echo "Packages assembled:"
          ls -la $PACKAGE_ROOT/

      - name: Create archives
        run: |
          VERSION=${{ steps.params.outputs.version }}
          ARTIFACTS_DIR=release-artifacts
          mkdir -p $ARTIFACTS_DIR

          for target in linux-amd64 linux-arm64 linux-armv7; do
            ARCHIVE_NAME="ezbookkeeping-${VERSION}-${target}.tar.gz"
            tar -czf "$ARTIFACTS_DIR/$ARCHIVE_NAME" -C package/ezbookkeeping-$target .
            echo "Created $ARCHIVE_NAME"
          done

          for target in macos-amd64 macos-arm64; do
            ARCHIVE_NAME="ezbookkeeping-${VERSION}-${target}.tar.gz"
            tar -czf "$ARTIFACTS_DIR/$ARCHIVE_NAME" -C package/ezbookkeeping-$target .
            echo "Created $ARCHIVE_NAME"
          done

          (cd package/ezbookkeeping-windows-amd64 && zip -r -9 "../../$ARTIFACTS_DIR/ezbookkeeping-${VERSION}-windows-amd64.zip" .)
          echo "Created ezbookkeeping-${VERSION}-windows-amd64.zip"

          echo ""
          echo "All release artifacts:"
          ls -la $ARTIFACTS_DIR/

      - name: List release artifacts
        run: ls -la release-artifacts/

      - name: Create or Update Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-latest"
          echo "Using fixed version tag: $VERSION"

          gh release delete "$VERSION" --yes 2>/dev/null || true

          gh release create "$VERSION" \
            --title "Development Build (Latest)" \
            --notes "Automatic build from commit ${{ github.sha }}%0A%0A**Platforms:**%0A- Linux amd64%0A- Linux arm64%0A- Linux armv7%0A- Windows amd64%0A- macOS amd64%0A- macOS arm64" \
            --prerelease \
            release-artifacts/*