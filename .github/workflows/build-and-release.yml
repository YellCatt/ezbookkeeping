name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-latest
            os: linux
            arch: mipsle
            suffix: linux-mipsle
            ext: ''
            goflags: 'CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat'
            ldflags: '-s -w -extldflags=-static'
            tags: 'netgo,osusergo'
            cross_compiler: ''
            needs_frontend: true
          - runner: windows-latest
            os: windows
            arch: amd64
            suffix: windows-amd64
            ext: '.exe'
            goflags: 'CGO_ENABLED=1 GOOS=windows GOARCH=amd64'
            ldflags: '-s -w -linkmode external -extldflags "-static"'
            tags: 'timetzdata'
            cross_compiler: ''
            needs_frontend: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install MinGW for Windows
      if: matrix.target.os == 'windows'
      shell: pwsh
      run: |
        $mingwVersion = "15.2.0"
        $mingwRevision = "v13-rev1"
        $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/${mingwVersion}-rt_${mingwRevision}/x86_64-${mingwVersion}-release-posix-seh-ucrt-rt_${mingwRevision}.7z"
        $archive = "C:\mingw.7z"
        $mingwDir = "C:\mingw64"

        Write-Host "Downloading MinGW from ${url}"
        Invoke-WebRequest -Uri ${url} -OutFile ${archive}

        Remove-Item -Recurse -Force ${mingwDir} -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path ${mingwDir}

        Write-Host "Extracting MinGW to ${mingwDir}"
        7z x ${archive} -oC:\
        "${mingwDir}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Fix go modules
      run: |
        go clean -modcache
        go mod tidy

    - name: Set up Node.js (for frontend build)
      if: matrix.target.needs_frontend
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build frontend
      if: matrix.target.needs_frontend
      run: |
        npm install
        npm run build

    - name: Build for Linux mipsle
      if: matrix.target.os == 'linux'
      run: |
        VERSION=$(grep '"version": ' package.json | awk -F ':' '{print $2}' | tr -d ' ' | tr -d ',' | tr -d '"')
        COMMIT_HASH=$(git rev-parse --short=7 HEAD)
        BUILD_UNIXTIME=$(date '+%s')

        # 使用 bash 数组构建参数，彻底避免空参数问题
        BUILD_ARGS=(-a -v -trimpath)
        BUILD_ARGS+=(-ldflags="${{ matrix.target.ldflags }} -X main.Version=$VERSION -X main.CommitHash=$COMMIT_HASH -X main.BuildUnixTime=$BUILD_UNIXTIME")

        if [ -n "${{ matrix.target.tags }}" ]; then
          BUILD_ARGS+=(-tags="${{ matrix.target.tags }}")
        fi

        BUILD_ARGS+=(-o "ezbookkeeping${{ matrix.target.ext }}")
        BUILD_ARGS+=("ezbookkeeping.go")

        echo "Building with args: ${BUILD_ARGS[@]}"
        ${{ matrix.target.goflags }} go build "${BUILD_ARGS[@]}"

        ls -la ezbookkeeping*

    - name: Build for Windows amd64
      if: matrix.target.os == 'windows'
      shell: pwsh
      run: |
        $version = (Get-Content package.json | ConvertFrom-Json).version
        $commitHash = git rev-parse --short=7 HEAD
        $buildUnixTime = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()

        $env:CGO_ENABLED = "1"
        $env:GOOS = "windows"
        $env:GOARCH = "amd64"

        $extraArgs = "-X main.Version=$version -X main.CommitHash=$commitHash -X main.BuildUnixTime=$buildUnixTime"

        go build -a -v -trimpath -tags timetzdata -ldflags "-s -w -linkmode external -extldflags '-static' $extraArgs" -o ezbookkeeping.exe ezbookkeeping.go

        Remove-Item Env:\CGO_ENABLED -ErrorAction SilentlyContinue
        Remove-Item Env:\GOOS -ErrorAction SilentlyContinue
        Remove-Item Env:\GOARCH -ErrorAction SilentlyContinue

        Get-ChildItem ezbookkeeping*

    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-${{ matrix.target.suffix }}
        path: ezbookkeeping${{ matrix.target.ext }}

    - name: Upload frontend artifact
      if: matrix.target.needs_frontend
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Set up build parameters
        id: params
        run: |
          VERSION=$(grep '"version": ' package.json | awk -F ':' '{print $2}' | tr -d ' ' | tr -d ',' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: |
          PACKAGE_ROOT=package
          rm -rf $PACKAGE_ROOT
          mkdir -p $PACKAGE_ROOT

          for target in linux-mipsle windows-amd64; do
            PKG_DIR=$PACKAGE_ROOT/ezbookkeeping-$target
            mkdir -p $PKG_DIR
            mkdir -p $PKG_DIR/data
            mkdir -p $PKG_DIR/storage
            mkdir -p $PKG_DIR/log

            if [ "$target" = "windows-amd64" ]; then
              cp artifacts/backend-$target/ezbookkeeping.exe $PKG_DIR/
            else
              cp artifacts/backend-$target/ezbookkeeping $PKG_DIR/
              chmod +x $PKG_DIR/ezbookkeeping
            fi

            cp -R artifacts/frontend-dist/dist $PKG_DIR/public
            cp -R conf $PKG_DIR/conf
            cp -R templates $PKG_DIR/templates
            cp LICENSE $PKG_DIR/
          done

          echo "Packages assembled:"
          ls -la $PACKAGE_ROOT/

      - name: Create archives
        run: |
          VERSION=${{ steps.params.outputs.version }}
          ARTIFACTS_DIR=release-artifacts
          mkdir -p $ARTIFACTS_DIR

          tar -czf "$ARTIFACTS_DIR/ezbookkeeping-${VERSION}-linux-mipsle.tar.gz" -C package/ezbookkeeping-linux-mipsle .
          echo "Created ezbookkeeping-${VERSION}-linux-mipsle.tar.gz"

          (cd package/ezbookkeeping-windows-amd64 && zip -r -9 "../../$ARTIFACTS_DIR/ezbookkeeping-${VERSION}-windows-amd64.zip" .)
          echo "Created ezbookkeeping-${VERSION}-windows-amd64.zip"

          echo ""
          echo "All release artifacts:"
          ls -la $ARTIFACTS_DIR/

      - name: List release artifacts
        run: ls -la release-artifacts/

      - name: Create or Update Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-latest"
          echo "Using fixed version tag: $VERSION"

          gh release delete "$VERSION" --yes 2>/dev/null || true

          gh release create "$VERSION" \
            --title "Development Build (Latest)" \
            --notes "Automatic build from commit ${{ github.sha }}%0A%0A**Platforms:**%0A- Linux mipsle (极路由2 - 软浮点，已禁用CGO，静态编译)%0A- Windows amd64" \
            --prerelease \
            release-artifacts/*